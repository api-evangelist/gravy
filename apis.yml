name: Gravy
description: >-
  Gravy is a local-first, AI-powered personal finance workspace that runs on the Mac. It connects
  every bank, credit card, and investment account, automatically categorizes every transaction, and
  lets people ask plain-language questions about their money while keeping the data on their own
  device for privacy. Gravy focuses on optimizing spending, surfacing savings, tracking investments
  and recurring subscriptions, and automating tedious money tasks for both individuals and small
  businesses. It is a Y Combinator (Spring 2026) company. Gravy is a consumer application and, as of
  this profile, publishes no public developer API, documentation, or SDK surface.
